<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Meu Treino</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: {
                            50: '#f0fdf4', 100: '#dcfce7', 200: '#bbf7d0', 300: '#86efac',
                            400: '#4ade80', 500: '#22c55e', 600: '#16a34a', 700: '#15803d',
                            800: '#166534', 900: '#14532d',
                        }
                    }
                }
            }
        }
    </script>
    <link href="https://cdn.jsdelivr.net/npm/remixicon@3.5.0/fonts/remixicon.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap');
        body { font-family: 'Inter', sans-serif; background-color: #f8fafc; -webkit-tap-highlight-color: transparent; }
        .pb-safe { padding-bottom: env(safe-area-inset-bottom); }
    </style>
</head>
<body class="text-gray-800 antialiased selection:bg-brand-200 selection:text-brand-900">

    <div id="rest-banner" class="fixed top-0 left-0 w-full bg-brand-600 text-white p-3 z-50 shadow-md transition-all" style="display: none;">
        <div class="max-w-md mx-auto flex justify-between items-center px-4">
            <div class="flex items-center gap-2">
                <i class="ri-timer-flash-line text-xl animate-pulse"></i>
                <span class="font-bold text-sm">Próximo exercício...</span>
            </div>
            <div class="text-lg font-black bg-white/20 px-3 py-1 rounded-lg">
                <span id="rest-time-left">90</span>s
            </div>
        </div>
    </div>

    <main id="app-content" class="min-h-screen"></main>

    <nav class="fixed bottom-0 left-0 w-full bg-white/90 backdrop-blur-lg border-t border-gray-100 pb-safe z-40 shadow-[0_-10px_40px_rgba(0,0,0,0.03)]">
        <div class="max-w-md mx-auto flex justify-around p-2">
            <button onclick="window.navigate('home')" class="flex flex-col items-center p-3 text-gray-400 hover:text-brand-600 active:scale-95 transition-all w-full rounded-2xl">
                <i class="ri-home-5-line text-2xl mb-1"></i>
                <span class="text-[10px] font-bold uppercase tracking-wider">Treinos</span>
            </button>
            <button onclick="window.navigate('history')" class="flex flex-col items-center p-3 text-gray-400 hover:text-brand-600 active:scale-95 transition-all w-full rounded-2xl">
                <i class="ri-history-line text-2xl mb-1"></i>
                <span class="text-[10px] font-bold uppercase tracking-wider">Histórico</span>
            </button>
        </div>
    </nav>

    <!-- O app.js agora é responsável por importar tudo sozinho -->
    <script type="module" src="./app.js"></script>
</body>
</html>
