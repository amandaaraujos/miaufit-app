<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>MiauFit - Treino</title>
    
    <!-- PWA Configs ajustadas para GitHub Pages -->
    <link rel="manifest" href="./manifest.json">
    <meta name="theme-color" content="#2563eb">
    <link rel="apple-touch-icon" href="./miaufit_logo_192x192.png">
    
    <!-- Tailwind CSS (Para manter o design Glassmorphism e Mobile-first) -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 text-gray-800 font-sans antialiased pb-20">

    <!-- BANNER DE DESCANSO ENTRE EXERCÍCIOS -->
    <div id="rest-banner" style="display: none; position: fixed; top: 20px; left: 50%; transform: translateX(-50%); background-color: #f59e0b; color: white; padding: 15px 25px; border-radius: 12px; font-weight: bold; font-size: 18px; z-index: 9999; box-shadow: 0 4px 6px rgba(0,0,0,0.3); text-align: center; width: 90%; max-width: 350px;">
        ⏳ Preparando próximo: <span id="rest-time-left">90</span>s
    </div>

    <!-- CABEÇALHO DO APP -->
    <header class="bg-blue-600 text-white p-4 shadow-md sticky top-0 z-50">
        <div class="container mx-auto flex justify-center items-center">
            <h1 class="text-2xl font-bold flex items-center gap-2">
                🐾 MiauFit
            </h1>
        </div>
    </header>

    <!-- RASTREADOR DE FASES DA CARTILHA -->
    <div id="phase-tracker" class="bg-blue-500 text-white text-center p-2 font-bold text-sm shadow-sm">
        Calculando fase do treino...
    </div>

    <!-- ÁREA PRINCIPAL ONDE OS EXERCÍCIOS APARECEM -->
    <main id="app-container" class="container mx-auto p-4 flex flex-col gap-4">
        <!-- O conteúdo gerado dinamicamente pelo app.js será renderizado aqui -->
    </main>

    <!-- SCRIPTS DO PROJETO -->
    <script src="./firebase.js"></script>
    <script src="./cartilha.js"></script>
    <script src="./app.js"></script>

    <!-- REGISTRO DO SERVICE WORKER (Para instalação do PWA) -->
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./sw.js')
                    .then(reg => console.log('Service Worker registrado com sucesso!'))
                    .catch(err => console.error('Erro ao registrar Service Worker:', err));
            });
        }
    </script>
</body>
</html>
